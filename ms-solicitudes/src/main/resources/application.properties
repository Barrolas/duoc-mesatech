spring.application.name=ms-solicitudes
server.port=8081

spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_AUDIENCE}

spring.datasource.url=${SOLICITUDES_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mesatech_solicitudes}
spring.datasource.username=${POSTGRES_USER:mesatech}
spring.datasource.password=${POSTGRES_PASSWORD:mesatech}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# RabbitMQ EP2 (consumidor categoria.creada). No eliminar ni reutilizar usuario de catalogo.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:mesatech}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:mesatech}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:mesatech}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.missing-queues-fatal=false

mesatech.rabbitmq.exchange=catalogo.exchange
mesatech.rabbitmq.queue=solicitudes.catalogo.queue
mesatech.rabbitmq.routing-key=categoria.creada
mesatech.rabbitmq.declare=${RABBITMQ_DECLARE:true}

# Apache Kafka EP3 (Alternativa 1: mesatech-solicitudes-kafka)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.group-id=${KAFKA_SOLICITUDES_GROUP_ID:mesatech-solicitudes-kafka}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.listener.ack-mode=manual
# Una sola fuente: KAFKA_LISTENER_CONCURRENCY controla ambos @KafkaListener (creada y estado).
mesatech.kafka.listener.concurrency=${KAFKA_LISTENER_CONCURRENCY:3}
spring.kafka.listener.concurrency=${mesatech.kafka.listener.concurrency}

mesatech.kafka.topics.solicitud-creada=${KAFKA_TOPIC_SOLICITUD_CREADA:mesatech.solicitud.creada}
mesatech.kafka.topics.solicitud-estado=${KAFKA_TOPIC_SOLICITUD_ESTADO:mesatech.solicitud.estado}
mesatech.kafka.topics.dlq=${KAFKA_TOPIC_DLQ:mesatech.dlq.eventos}
mesatech.operacion.log-path=${OPERACION_LOG_PATH:logs/operacion.jsonl}
