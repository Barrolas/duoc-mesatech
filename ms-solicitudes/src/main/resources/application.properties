spring.application.name=ms-solicitudes
server.port=8081

spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_AUDIENCE}

spring.datasource.url=${SOLICITUDES_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mesatech_solicitudes}
spring.datasource.username=${POSTGRES_USER:mesatech}
spring.datasource.password=${POSTGRES_PASSWORD:mesatech}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Consumidor. En AWS usar el usuario de la app, el vhost mesatech y el endpoint de la RDS de solicitudes.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:mesatech}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:mesatech}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:mesatech}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.missing-queues-fatal=false

mesatech.rabbitmq.exchange=catalogo.exchange
mesatech.rabbitmq.queue=solicitudes.catalogo.queue
mesatech.rabbitmq.routing-key=categoria.creada
mesatech.rabbitmq.declare=${RABBITMQ_DECLARE:true}
