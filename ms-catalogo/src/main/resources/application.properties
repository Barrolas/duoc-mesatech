spring.application.name=ms-catalogo
server.port=8082

spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_AUDIENCE}

spring.datasource.url=${CATALOGO_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mesatech_catalogo}
spring.datasource.username=${POSTGRES_USER:mesatech}
spring.datasource.password=${POSTGRES_PASSWORD:mesatech}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# EP2 — RabbitMQ publicador (variables desde env / ms-catalogo.env)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:mesatech}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

mesatech.rabbitmq.exchange=catalogo.exchange
mesatech.rabbitmq.routing-key=categoria.creada
mesatech.rabbitmq.declare=${RABBITMQ_DECLARE:true}
