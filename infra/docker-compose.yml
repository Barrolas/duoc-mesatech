services:
  postgres:
    image: postgres:16
    container_name: mesatech-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mesatech
      POSTGRES_PASSWORD: mesatech
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesatech"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
